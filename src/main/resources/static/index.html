<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Fish-Agent 本地演示</title>
    <style>
        :root {
            --bg: #0f1115;
            --panel: #171a21;
            --border: #262b36;
            --text: #e6e9ef;
            --muted: #8b93a5;
            --accent: #4c8dff;
            --green: #3fbf7f;
            --amber: #d9a340;
            --red: #e05561;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            background: var(--bg);
            color: var(--text);
            font: 14px/1.6 -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        aside {
            width: 320px;
            border-right: 1px solid var(--border);
            padding: 18px;
            overflow-y: auto;
            background: var(--panel);
            flex-shrink: 0;
        }

        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-width: 0;
        }

        h1 { font-size: 16px; margin: 0 0 4px; }
        h2 { font-size: 13px; color: var(--muted); margin: 22px 0 8px; text-transform: uppercase; letter-spacing: .06em; }
        .sub { font-size: 12px; color: var(--muted); margin-bottom: 18px; }

        label { display: block; font-size: 12px; color: var(--muted); margin: 10px 0 4px; }

        input, select, textarea, button {
            font: inherit;
            color: var(--text);
            background: #0c0e12;
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 8px 10px;
            width: 100%;
        }

        input:focus, textarea:focus { outline: none; border-color: var(--accent); }

        button {
            background: var(--accent);
            border: none;
            color: #fff;
            cursor: pointer;
            font-weight: 500;
            margin-top: 10px;
        }
        button:hover { filter: brightness(1.1); }
        button.ghost { background: #0c0e12; border: 1px solid var(--border); color: var(--muted); }
        button.ghost:hover { color: var(--text); border-color: var(--accent); }
        button:disabled { opacity: .5; cursor: not-allowed; }

        .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
        .chip {
            font-size: 12px;
            padding: 4px 9px;
            border: 1px solid var(--border);
            border-radius: 999px;
            cursor: pointer;
            color: var(--muted);
            background: #0c0e12;
        }
        .chip:hover { color: var(--accent); border-color: var(--accent); }

        .tool {
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 8px 10px;
            margin-bottom: 8px;
            background: #0c0e12;
        }
        .tool b { font-size: 13px; color: var(--accent); font-weight: 600; }
        .tool p { margin: 4px 0 0; font-size: 12px; color: var(--muted); }

        #log {
            flex: 1;
            overflow-y: auto;
            padding: 20px 24px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .msg { max-width: 860px; }
        .msg .who {
            font-size: 12px;
            color: var(--muted);
            margin-bottom: 5px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .msg .body {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 11px 14px;
            white-space: pre-wrap;
            word-break: break-word;
        }
        .msg.user .body { background: #1b2433; border-color: #2b3a55; }

        .badge {
            font-size: 11px;
            padding: 1px 7px;
            border-radius: 999px;
            border: 1px solid var(--border);
            color: var(--muted);
        }
        .badge.tool { color: var(--amber); border-color: #4a3c1c; }
        .badge.ok { color: var(--green); border-color: #1e4632; }
        .badge.err { color: var(--red); border-color: #4d2429; }

        details.trace {
            margin-top: 8px;
            border: 1px dashed var(--border);
            border-radius: 8px;
            padding: 8px 12px;
            font-size: 12.5px;
        }
        details.trace summary { cursor: pointer; color: var(--muted); }
        details.trace[open] summary { margin-bottom: 8px; }
        .ev { padding: 3px 0; border-bottom: 1px solid #1c2029; color: #b9c0cd; }
        .ev:last-child { border-bottom: none; }
        .ev .evt { color: var(--accent); font-weight: 600; margin-right: 6px; }

        #composer {
            border-top: 1px solid var(--border);
            padding: 14px 24px 18px;
            background: var(--panel);
        }
        #composer .row { display: flex; gap: 10px; align-items: flex-end; }
        #composer textarea { resize: none; height: 62px; }
        #composer button { width: 96px; margin: 0; height: 62px; }

        .hint { font-size: 12px; color: var(--muted); margin-top: 8px; }
        .stat { display: flex; justify-content: space-between; font-size: 12px; padding: 3px 0; }
        .stat span:last-child { color: var(--text); }
    </style>
</head>
<body>
<aside>
    <h1>Fish-Agent 本地演示</h1>
    <div class="sub">验证工具调用 · 多轮记忆 · 流式输出</div>

    <label>会话标识</label>
    <input id="sessionId" value="demo-1">

    <label>运行模式</label>
    <select id="mode" disabled>
        <option>由 application.yml 决定</option>
    </select>

    <h2>预置问题</h2>
    <div class="chips" id="samples">
        <span class="chip">现在几点了？</span>
        <span class="chip">帮我算一下 (128+72)*3/5</span>
        <span class="chip">东京天气怎么样？</span>
        <span class="chip">把 "hello world" 反过来</span>
        <span class="chip">10 除以 0 等于多少</span>
        <span class="chip">我刚才问了什么？</span>
    </div>

    <h2>会话操作</h2>
    <button class="ghost" id="btnHistory">查看记忆消息</button>
    <button class="ghost" id="btnReset">重置记忆</button>
    <button class="ghost" id="btnDestroy">销毁会话</button>

    <h2>运行时状态</h2>
    <div id="status"></div>

    <h2>已注册工具</h2>
    <div id="tools"></div>
</aside>

<main>
    <div id="log"></div>
    <div id="composer">
        <div class="row">
            <textarea id="input" placeholder="输入消息，回车发送（Shift+Enter 换行）"></textarea>
            <button id="send">发送</button>
        </div>
        <div class="hint" id="hint">需要本地已启动 Ollama，且模型支持 tools。</div>
    </div>
</main>

<script>
    const $ = id => document.getElementById(id);
    const log = $('log');

    function role(color, text) {
        const div = document.createElement('div');
        div.className = 'msg ' + (color || '');
        return div;
    }

    function bubble(cls, who, text, badges) {
        const wrap = document.createElement('div');
        wrap.className = 'msg ' + (cls || '');
        const head = document.createElement('div');
        head.className = 'who';
        head.textContent = who;
        if (badges) {
            for (const [label, kind] of badges) {
                const b = document.createElement('span');
                b.className = 'badge ' + (kind || '');
                b.textContent = label;
                head.appendChild(b);
            }
        }
        const body = document.createElement('div');
        body.className = 'body';
        body.textContent = text;
        wrap.append(head, body);
        log.appendChild(wrap);
        log.scrollTop = log.scrollHeight;
        return body;
    }

    function eventList(events) {
        const box = document.createElement('div');
        box.style.padding = '0 24px';
        const details = document.createElement('details');
        details.className = 'trace';
        details.style.maxWidth = '860px';
        const summary = document.createElement('summary');
        summary.textContent = `过程事件（${events.length}）`;
        details.appendChild(summary);
        for (const ev of events) {
            const line = document.createElement('div');
            line.className = 'ev';
            const tag = document.createElement('span');
            tag.className = 'evt';
            tag.textContent = ev.type;
            line.appendChild(tag);
            const rest = {...ev};
            delete rest.type;
            line.appendChild(document.createTextNode(JSON.stringify(rest)));
            details.appendChild(line);
        }
        box.appendChild(details);
        log.appendChild(box);
        log.scrollTop = log.scrollHeight;
    }

    async function send() {
        const sessionId = $('sessionId').value.trim() || 'default';
        const message = $('input').value.trim();
        if (!message) return;

        $('input').value = '';
        $('send').disabled = true;
        bubble('user', '你', message);

        const pending = bubble('', 'Agent', '思考中…');
        const started = performance.now();

        try {
            const res = await fetch('/api/chat', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({sessionId, message})
            });
            const data = await res.json();
            const elapsed = Math.round(performance.now() - started);

            if (data.error) {
                pending.textContent = '调用失败：' + data.error;
                pending.parentElement.querySelector('.who').appendChild(badge('错误', 'err'));
                return;
            }

            pending.textContent = data.answer || '(空回答)';

            const head = pending.parentElement.querySelector('.who');
            head.appendChild(badge(data.stopReason, data.stopReason === 'stop' ? 'ok' : ''));
            head.appendChild(badge(`${data.iterations} 轮`));
            head.appendChild(badge(`${elapsed}ms`));
            head.appendChild(badge(`${data.tokenUsage.totalTokens} tokens`));
            if (data.streamChunkCount > 0) {
                head.appendChild(badge(`流式 ${data.streamChunkCount} 片`, 'ok'));
            }
            if (data.events && data.events.length) {
                eventList(data.events);
            }
        } catch (e) {
            pending.textContent = '请求异常：' + e.message;
        } finally {
            $('send').disabled = false;
            $('input').focus();
        }
    }

    function badge(text, kind) {
        const b = document.createElement('span');
        b.className = 'badge ' + (kind || '');
        b.textContent = text;
        return b;
    }

    async function loadTools() {
        const res = await fetch('/api/tools');
        const tools = await res.json();
        $('tools').innerHTML = '';
        for (const t of tools) {
            const div = document.createElement('div');
            div.className = 'tool';
            const name = document.createElement('b');
            name.textContent = t.name;
            const desc = document.createElement('p');
            desc.textContent = t.description || '(无描述)';
            div.append(name, desc);
            $('tools').appendChild(div);
        }
    }

    async function loadStatus() {
        const res = await fetch('/api/status');
        const s = await res.json();
        const rows = [
            ['运行模式', s.mode],
            ['工具数量', s.toolCount],
            ['活跃会话', s.activeSessions],
            ['存储会话', s.storedSessions],
        ];
        $('status').innerHTML = rows.map(([k, v]) =>
            `<div class="stat"><span>${k}</span><span>${v}</span></div>`).join('');
    }

    async function showHistory() {
        const sessionId = $('sessionId').value.trim() || 'default';
        const res = await fetch(`/api/sessions/${encodeURIComponent(sessionId)}/messages`);
        const messages = await res.json();
        if (!messages.length) {
            bubble('', '系统', `会话 ${sessionId} 暂无记忆消息`);
            return;
        }
        const text = messages.map((m, i) => {
            const calls = m.toolCalls ? `  [调用: ${m.toolCalls.map(c => c.name).join(', ')}]` : '';
            const tn = m.toolName ? `  [工具: ${m.toolName}]` : '';
            return `${i + 1}. ${m.role}${tn}${calls}\n   ${m.content}`;
        }).join('\n');
        bubble('', `会话 ${sessionId} 的记忆（${messages.length} 条）`, text);
    }

    async function resetSession() {
        const sessionId = $('sessionId').value.trim() || 'default';
        const res = await fetch(`/api/sessions/${encodeURIComponent(sessionId)}/reset`, {method: 'POST'});
        const data = await res.json();
        bubble('', '系统', `已重置会话 ${data.sessionId}，剩余消息 ${data.remainingMessages} 条`);
        loadStatus();
    }

    async function destroySession() {
        const sessionId = $('sessionId').value.trim() || 'default';
        const res = await fetch(`/api/sessions/${encodeURIComponent(sessionId)}`, {method: 'DELETE'});
        const data = await res.json();
        bubble('', '系统',
            data.destroyed ? `已销毁会话 ${data.sessionId}（当前活跃 ${data.activeSessions}）`
                           : `会话 ${data.sessionId} 此前不存在`);
        loadStatus();
    }

    $('send').onclick = send;
    $('btnHistory').onclick = showHistory;
    $('btnReset').onclick = resetSession;
    $('btnDestroy').onclick = destroySession;

    $('input').addEventListener('keydown', e => {
        if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            send();
        }
    });

    $('samples').addEventListener('click', e => {
        if (e.target.classList.contains('chip')) {
            $('input').value = e.target.textContent;
            $('input').focus();
        }
    });

    loadTools();
    loadStatus();
</script>
</body>
</html>
