server:
  port: 8084

spring:
  application:
    name: fish-agent-web
  mvc:
    # 页面里的 fetch 直接拿 text/plain，避免 SSE 事件格式干扰
    async:
      request-timeout: 120s

# Fish-Agent SDK 的配置，前缀对齐 AgentProperties
fish-agent:
  # Ollama 服务地址，需本地已启动 ollama serve
  base-url: http://localhost:11434
  # 模型需支持 tools，例如 qwen2.5:7b / qwen3:8b / llama3.1:8b
  # 注意：my-doctor:0.2（qwen3 微调）会在正文里「编造」工具调用过程而不真正调用，不要用它
  model: qwen3:8b
  temperature: 0.7
  # native（原生 Tool Calling）或 react（文本 ReAct），两种都可用，便于对比
  mode: native
  # 流式输出：token 会实时推送到页面
  streaming: true
  max-iterations: 8
  max-repeated-tool-calls: 3
  # 关闭摘要时参与上下文的最近消息条数；开启摘要后由 summarize-keep 决定
  session-window-size: 20
  # 会话落盘目录：每个会话一个 JSONL 文件，重启不丢历史
  session-directory: .fishagent/sessions
  # 上下文摘要压缩：超过阈值时把早期消息压成一条摘要，避免信息硬丢失
  # 注意：压缩是同步的，每跨过一次阈值那次请求会多一次模型调用（数秒）
  summarize-enabled: true
  # 未摘要消息数超过该值时触发压缩（建议 15-30，太小会频繁调用模型）
  summarize-trigger: 20
  # 压缩后保留的最近消息条数（必须明显小于 trigger，否则会刚压缩完又触发）
  summarize-keep: 5

logging:
  level:
    root: INFO
    com.zheng.fishagent: DEBUG

# 便于本地排查
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
